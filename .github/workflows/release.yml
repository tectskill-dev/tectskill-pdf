# TectSkill PDF: publish a GitHub Release after "Build Tauri" succeeds
name: Release

on:
  workflow_run:
    workflows: ["Build Tauri"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version
        id: version
        run: echo "version=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows-latest
          path: tauri-bundles/windows
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: TectSkill PDF ${{ steps.version.outputs.version }}
          body: |
            ## TectSkill PDF ${{ steps.version.outputs.version }}

            ชุดเครื่องมือ PDF ภาษาไทย ใช้งานออฟไลน์ในเครื่อง ไฟล์ไม่ถูกส่งไปที่ไหน

            ### ดาวน์โหลด (Windows 10/11)
            - **ตัวติดตั้ง (แนะนำ):** ไฟล์ `*-setup.exe` หรือ `.msi`
            - **แบบพกพา (ไม่ต้องติดตั้ง):** `TectSkill-PDF-Windows-x64-Portable.zip`

            > ถ้า Windows แสดง "Windows protected your PC" ให้กด **More info → Run anyway**
            > (แอปยังไม่ได้เซ็นใบรับรองนักพัฒนา)

            พัฒนาต่อยอดจาก [PDFCraft](https://github.com/PDFCraftTool/pdfcraft) · AGPL-3.0 · ติดต่อ tectskill@gmail.com
          files: |
            tauri-bundles/windows/**/*.exe
            tauri-bundles/windows/**/*.msi
            tauri-bundles/windows/**/*.zip
          draft: false
          prerelease: false
